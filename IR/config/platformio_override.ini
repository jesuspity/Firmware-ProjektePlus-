; Projekte+ - build do emissor IR (ESP8266)
; Uso: pio run -e tasmota-ir-projekte
[platformio]
default_envs            = tasmota-ir-projekte

[env:tasmota-ir-projekte]
build_flags             = ${env.build_flags} -DFIRMWARE_IR
lib_extra_dirs          = lib/lib_basic, lib/lib_ssl

; Mesmo firmware, layout 4 MB (1 MB programa + ~1 MB OTA + 2 MB FS).
; Permite OTA direto do .bin.gz (sem passo minimal). Primeira gravação via serial.
[env:tasmota-ir-projekte-4M]
board                   = esp8266_4M2M
; -DESP8266_1M só desliga o bloco que, em placas >1M, força UFILESYS/FTP/SPI/SD/Ping
; (tasmota_configurations.h). O layout de flash continua 4M2M.
build_flags             = ${env.build_flags} -DFIRMWARE_IR -DESP8266_1M
lib_extra_dirs          = lib/lib_basic, lib/lib_ssl

; Build público (sem senhas de Wi-Fi e MQTT) para o repositório público.
; Mesmo código; PRJ_CRED("...") vira "" (ver tasmota/user_config_override.h).
[env:tasmota-ir-projekte-4M-public]
board                   = esp8266_4M2M
build_flags             = ${env.build_flags} -DFIRMWARE_IR -DESP8266_1M -DPROJEKTE_PUBLIC
lib_extra_dirs          = lib/lib_basic, lib/lib_ssl
